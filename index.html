<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Calculadora de Crédito</title>
<style>
  :root{
    --primary:#2563eb;
    --card-bg:#fff;
    --muted:#6b7280;
    --surface:#f8fafc;
  }
  body{
    font-family: "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--surface);
    margin: 20px;
    color:#111827;
  }
  h1{ text-align:center; color:#0f172a; margin-bottom:20px; }
  .card{
    max-width:1000px;
    margin:0 auto;
    background:var(--card-bg);
    padding:24px;
    border-radius:12px;
    box-shadow:0 6px 18px rgba(15,23,42,0.08);
  }
  form{
    display:grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap:16px;
    align-items:end;
  }
  label{ display:block; font-weight:600; margin-bottom:6px; font-size:0.9rem; color:#374151;}
  select, input{
    width:100%;
    padding:10px;
    border-radius:8px;
    border:1px solid #d1d5db;
    font-size:1rem;
    box-sizing:border-box;
  }
  .info {
    margin-top:20px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 15px;
    background:#eff6ff; /* Azul claro */
    padding:20px;
    border-radius:10px;
    border:1px solid #bfdbfe;
  }
  .info p{ margin:0; font-size:0.95rem; }
  .info strong{ display:block; color:#1e40af; font-size:0.8rem; text-transform: uppercase;}
  .info span { font-size: 1.1rem; font-weight: bold; color: #1e3a8a; }

  .table-container {
    margin-top: 24px;
    overflow-x: auto;
    border-radius: 8px;
    border: 1px solid #e5e7eb;
  }
  table{
    width:100%;
    border-collapse:collapse;
    background:#fff;
  }
  th, td{
    padding:12px;
    border-bottom:1px solid #f3f4f6;
    text-align:right;
    font-size:0.85rem;
  }
  thead th{
    background:var(--primary);
    color:#fff;
    position: sticky;
    top: 0;
  }
  tfoot td {
    background: #f1f5f9;
    font-weight: bold;
    color: #0f172a;
    border-top: 2px solid #cbd5e1;
  }
  tbody tr:nth-child(even) { background: #f9fafb; }
  .text-left { text-align: left; }
</style>
</head>
<body>

  <h1>Cotizador</h1>

  <div class="card">
    <form id="form">
      <div>
        <label>Tipo de Cliente</label>
        <select id="tipoCliente">
          <option value="NUEVO">NUEVO</option>
          <option value="ANTIGUO">ANTIGUO</option>
        </select>
      </div>
      <div>
        <label>Perfil Crediticio</label>
        <select id="perfil">
          <option value="A+">A+</option>
          <option value="BAA">BAA</option>
          <option value="BBB">BBB</option>
          <option value="BCC">BCC</option>
        </select>
      </div>
      <div>
        <label>Monto (COP)</label>
        <input id="monto" type="text" placeholder="$0" required />
      </div>
      <div>
        <label>Plazo (Meses)</label>
        <input id="plazo" type="number" min="1" max="120" value="12" required />
      </div>
      <div>
        <label>Género</label>
        <select id="genero">
          <option value="F">Femenino</option>
          <option value="M">Masculino</option>
        </select>
      </div>
      <div>
        <label>Edad</label>
        <select id="edad"></select>
      </div>
    </form>

    <div class="info" id="infoBlock" style="display:none;">
      <p><strong>Primera Cuota Aprox.</strong> <span id="cuotaFija"></span></p>
      <p><strong>Tasa Interés</strong> <span id="tasaTEA"></span></p>
      <p><strong>% MIPYME (Mes)</strong> <span id="aplicaMipyme"></span></p>
      <p id="fngLine"><strong>FNG Estimado (IVA Inc.)</strong> <span id="fngValue"></span></p>
    </div>

    <div class="table-container">
      <table id="tablaResultados" style="display:none;">
        <thead>
          <tr>
            <th class="text-left">#</th>
            <th>Cuota Total</th>
            <th>Capital</th>
            <th>Interés</th>
            <th>MIPYME</th>
            <th>Seguro</th>
            <th>Saldo</th>
          </tr>
        </thead>
        <tbody></tbody>
        <tfoot>
          <tr id="filaTotales"></tr>
        </tfoot>
      </table>
    </div>
  </div>

<script>
const CONFIG = {
  SMMLV: 1750000, 
  TOPES_SMMLV: {
    RANGO_1: 6,
    RANGO_2: 25,
    MIPYME_LIMITE: 4 
  },
  TASAS: {
    NUEVO: {
      "A+":  [48.65, 46.20, 35.20],
      "BAA": [56.50, 51.40, 37.20],
      "BBB": [60.70, 52.00, 37.50],
      "BCC": [65.00, 65.00, 65.00]
    },
    ANTIGUO: {
      "A+":  [44.65, 42.60, 32.20],
      "BAA": [55.85, 51.00, 36.60],
      "BBB": [60.20, 51.60, 37.00],
      "BCC": [65.00, 65.00, 65.00]
    }
  }
};

const fngTabla={1:[2.99,3.5,3.75],2:[2.99,3.5,3.75],3:[2.99,3.5,3.75],4:[2.99,3.5,3.75],5:[2.99,3.5,3.75],6:[2.99,3.5,3.75],7:[2.99,3.5,3.75],8:[2.99,3.5,3.75],9:[2.99,3.5,3.75],10:[2.99,3.5,3.75],11:[2.99,3.5,3.75],12:[2.99,3.5,3.75],13:[3.01,3.52,3.77],14:[3.03,3.58,3.84],15:[3.05,3.68,3.94],16:[3.06,3.8,4.07],17:[3.08,3.93,4.21],18:[3.1,4.09,4.38],19:[3.11,4.26,4.56],20:[3.13,4.44,4.76],21:[3.15,4.64,4.97],22:[3.17,4.84,5.18],23:[3.18,5.05,5.41],24:[3.2,5.27,5.64],25:[3.22,5.35,5.73],26:[3.23,5.45,5.83],27:[3.25,5.56,5.96],28:[3.27,5.68,6.09],29:[3.29,5.82,6.24],30:[3.3,5.97,6.4],31:[3.32,6.13,6.56],32:[3.34,6.29,6.74],33:[3.35,6.47,6.93],34:[3.37,6.65,7.12],35:[3.39,6.83,7.32],36:[3.41,7.02,7.53]};
const factoresSeguroVida={M:{18:0.377,19:0.377,20:0.377,21:0.383,22:0.390,23:0.397,24:0.404,25:0.409,26:0.415,27:0.419,28:0.426,29:0.432,30:0.437,31:0.444,32:0.451,33:0.459,34:0.469,35:0.479,36:0.479,37:0.490,38:0.502,39:0.516,40:0.532,41:0.547,42:0.565,43:0.581,44:0.600,45:0.620,46:0.641,47:0.663,48:0.693,49:0.727,50:0.765,51:0.852,52:0.909,53:0.979,54:1.060,55:1.155,56:1.158,57:1.274,58:1.410,59:1.562,60:1.727,61:2.331,62:2.542,63:2.760,64:2.968,65:3.177,66:3.382,67:3.591,68:3.866,69:4.116,70:4.397,71:3.068,72:3.347,73:3.719,74:4.194,75:4.788,76:5.520,77:6.410,78:7.507,79:8.990,80:10.937,81:10.937,82:10.937,83:10.937,84:10.937,85:10.937},F:{18:0.377,19:0.377,20:0.377,21:0.377,22:0.377,23:0.377,24:0.377,25:0.383,26:0.383,27:0.390,28:0.397,29:0.404,30:0.409,31:0.415,32:0.419,33:0.426,34:0.432,35:0.437,36:0.444,37:0.451,38:0.459,39:0.469,40:0.479,41:0.479,42:0.490,43:0.502,44:0.516,45:0.532,46:0.547,47:0.565,48:0.581,49:0.600,50:0.620,51:0.620,52:0.677,53:0.699,54:0.731,55:0.767,56:0.807,57:0.852,58:0.909,59:0.979,60:1.060,61:1.155,62:1.423,63:1.566,64:1.733,65:1.920,66:2.122,67:2.331,68:2.542,69:2.760,70:2.968,71:3.177,72:3.382,73:3.591,74:3.866,75:4.116,76:4.397,77:3.068,78:3.347,79:3.719,80:4.194,81:4.788,82:5.520,83:6.410,84:7.507,85:10.937}};

function formatoCOP(n){return"$"+Math.round(n).toLocaleString("es-CO");}
function limpiarNumero(v){return parseInt(String(v||"").replace(/[^\d]/g,""))||0;}

function obtenerIndiceRango(monto) {
  const sm = CONFIG.SMMLV;
  if (monto <= (sm * CONFIG.TOPES_SMMLV.RANGO_1)) return 0;
  if (monto <= (sm * CONFIG.TOPES_SMMLV.RANGO_2)) return 1;
  return 2;
}

function obtenerTasa(tipo, perfil, monto) {
  const idx = obtenerIndiceRango(monto);
  return CONFIG.TASAS[tipo][perfil][idx];
}

function obtenerPctMipyme(monto, tipo, perfil) {
  if (tipo === "ANTIGUO" && perfil === "A+") return 0;
  const sm = CONFIG.SMMLV;
  if (monto <= (sm * CONFIG.TOPES_SMMLV.MIPYME_LIMITE)) return 0.006045;
  if (monto <= (sm * CONFIG.TOPES_SMMLV.RANGO_2)) return 0.003675;
  return 0;
}

(function(){
  const elEdad=document.getElementById("edad");
  for(let a=18;a<=85;a++){
    const o=document.createElement("option"); o.value=a; o.textContent=a;
    if(a===30)o.selected=!0; elEdad.appendChild(o);
  }
})();

function calcularYRenderizar(){
  const t=document.getElementById("tipoCliente").value, 
        p=document.getElementById("perfil").value, 
        m=limpiarNumero(document.getElementById("monto").value), 
        pl=parseInt(document.getElementById("plazo").value)||0, 
        g=document.getElementById("genero").value, 
        e=parseInt(document.getElementById("edad").value)||0;

  if(!m || !pl) return;

  const tea = obtenerTasa(t, p, m);
  const tem = Math.pow(1 + tea/100, 1/12) - 1;
  const temPct = (tem * 100).toFixed(2);
  const cuotaBase = m * (tem / (1 - Math.pow(1 + tem, -pl)));
  const pctMipymeMensual = obtenerPctMipyme(m, t, p) * 1.19; 
  const factorSeguro = (g === "M" ? factoresSeguroVida.M[e] : factoresSeguroVida.F[e]) || 0.377;
  const seguroMensual = Math.ceil(m * (factorSeguro / 1000));

  const tbody = document.querySelector("#tablaResultados tbody");
  tbody.innerHTML = "";
  
  let saldo = m;
  let primeraCuota = 0;
  
  // Acumuladores para totales
  let totalCuota = 0;
  let totalCapital = 0;
  let totalInteres = 0;
  let totalMipyme = 0;
  let totalSeguro = 0;

  for(let i=1; i<=pl; i++){
    const interes = saldo * tem;
    const capital = cuotaBase - interes;
    const mipymeMes = saldo * pctMipymeMensual; 
    const cuotaTotalMes = cuotaBase + mipymeMes + seguroMensual;
    
    if(i === 1) primeraCuota = cuotaTotalMes;

    // Sumar a totales
    totalCuota += cuotaTotalMes;
    totalCapital += capital;
    totalInteres += interes;
    totalMipyme += mipymeMes;
    totalSeguro += seguroMensual;

    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td class="text-left">${i}</td>
      <td>${formatoCOP(cuotaTotalMes)}</td>
      <td>${formatoCOP(capital)}</td>
      <td>${formatoCOP(interes)}</td>
      <td>${formatoCOP(mipymeMes)}</td>
      <td>${formatoCOP(seguroMensual)}</td>
      <td>${formatoCOP(Math.max(0, saldo - capital))}</td>
    `;
    tbody.appendChild(tr);
    saldo -= capital;
  }

  // Render Totales en el tfoot
  document.getElementById("filaTotales").innerHTML = `
    <td class="text-left">TOTAL</td>
    <td>${formatoCOP(totalCuota)}</td>
    <td>${formatoCOP(totalCapital)}</td>
    <td>${formatoCOP(totalInteres)}</td>
    <td>${formatoCOP(totalMipyme)}</td>
    <td>${formatoCOP(totalSeguro)}</td>
    <td>-</td>
  `;

  // Actualizar Bloque Info
  document.getElementById("infoBlock").style.display="grid";
  document.getElementById("tasaTEA").textContent = `${tea.toFixed(2)}% E.A. - ${temPct}% Mes`;
  document.getElementById("cuotaFija").textContent = formatoCOP(primeraCuota);
  document.getElementById("aplicaMipyme").textContent = (obtenerPctMipyme(m, t, p)*100).toFixed(4) + "%";
  
  const fngIdx = Math.min(pl, 36);
  const fngPct = fngTabla[fngIdx] ? fngTabla[fngIdx][obtenerIndiceRango(m)] : 0;
  const vFNG = m * (fngPct / 100) * 1.19;
  document.getElementById("fngValue").textContent = `${fngPct}% - ${formatoCOP(vFNG)}`;
  
  document.getElementById("tablaResultados").style.display="table";
}

document.querySelectorAll("input, select").forEach(el => {
  el.addEventListener("input", (e) => {
    if(e.target.id === "monto"){
      const v = limpiarNumero(e.target.value);
      e.target.value = v ? formatoCOP(v) : "";
    }
    calcularYRenderizar();
  });
});
</script>
</body>
</html>
